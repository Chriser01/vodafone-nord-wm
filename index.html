*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#222}

table{width:100%;border-collapse:collapse;background:white;border-radius:15px;overflow:hidden;box-shadow:0 1px 7px rgba(0,0,0,.08)}
th{background:var(--dark);color:white;text-align:left;position:sticky;top:0;z-index:1}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:hover td{background:#fafafa}
.scroll{overflow:auto;max-height:72vh;border-radius:15px}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:800}

.flag{font-size:32px;margin-bottom:8px;min-height:36px}
.name{font-size:20px;font-weight:900;margin-bottom:7px}
.meta{color:#555;font-weight:700}
.rank{font-size:34px;font-weight:900;color:var(--red);margin-bottom:6px}
.footer-note{margin-top:20px;color:#666;font-size:12px;text-align:center}

function roundList(){const set=new Set(DATA.vorrunde.rows.map(r=>r["Spieltag"]).filter(Boolean));return Array.from(set).sort((a,b)=>Number(a)-Number(b))}

function dailyStats(round){const rows=DATA.vorrunde.rows.filter(r=>String(r["Spieltag"])===String(round));let topName="noch offen",topScore=null,underName="noch keiner";rows.forEach(r=>{const s1=scoreNumber(r["Punkte S1"]);const s2=scoreNumber(r["Punkte S2"]);if(s1!==null&&(topScore===null||s1>topScore)){topScore=s1;topName=r["Spieler 1"]}if(s2!==null&&(topScore===null||s2>topScore)){topScore=s2;topName=r["Spieler 2"]}const u1=Number(r["Top-Bonus S1"]||0);const u2=Number(r["Top-Bonus S2"]||0);if(u1>0)underName=r["Spieler 1"];if(u2>0)underName=r["Spieler 2"];});return [{"Kennzahl":"Ausgewählter Spieltag","Wert":round},{"Kennzahl":"Spieler des Tages","Wert":topName},{"Kennzahl":"Höchste Punktzahl am Tag","Wert":topScore===null?"noch offen":topScore},{"Kennzahl":"Underdog des Tages","Wert":underName}]}
function renderDailyDropdown(){const holder=document.getElementById("wmDaily");const rounds=roundList();holder.innerHTML=`<div class="toolbar"><select id="dailyRound">${rounds.map(r=>`<option value="${r}">Spieltag ${r}</option>`).join("")}</select></div><div id="dailyTable"></div>`;function apply(){table(document.getElementById("dailyTable"),["Kennzahl","Wert"],dailyStats(document.getElementById("dailyRound").value))}document.getElementById("dailyRound").addEventListener("change",apply);apply()}
function renderWM(){const p=document.getElementById("wm");const k=DATA.wm.kpis.filter(r=>r[0]!==""&&r[1]!=="");p.innerHTML=`<div class="grid">${k.map(r=>`<div class="card"><h3>${esc(r[0])}</h3><div class="kpi">${esc(r[1])}</div></div>`).join("")}</div><div class="note"><strong>Status:</strong> Urlaub = 1 · Frei = 1 · Schule = 1 · Krank = 0 · Mindestschwelle = 350 Punkte.</div><div class="two"><div class="card"><h3>Aktuelle Top 10</h3><div id="wmTop"></div></div><div class="card"><h3>Tagesauswertung / Underdog Champion</h3><div id="wmDaily"></div></div></div>`;const topRows=DATA.wm.top10_rows.filter(r=>r.some(x=>x!=="")).map(r=>Object.fromEntries(DATA.wm.top10_headers.map((h,i)=>[h,r[i]])));table(document.getElementById("wmTop"),DATA.wm.top10_headers,topRows);renderDailyDropdown()}
function renderDabei(){const p=document.getElementById("dabei");const rows=DATA.aktuell_dabei.rows||[];p.innerHTML=`<div class="hero"><h2>Aktuell dabei</h2><p>Genau 9 mögliche Gewinnerplätze: Top 4, Top Scorer Punkte, BB, MC, Underdog Champion und Kicktipp.</p></div><div class="winner-grid">${rows.map((r,i)=>`<div class="winner-card"><div class="rank">${i+1}</div><div class="label">${esc(r["Kategorie"]||"")}</div><div class="name">${esc(r["Gewinner"]||"noch offen")}</div><div class="meta">${esc(r["Wert"]||r["Rang/Quelle"]||"")}</div></div>`).join("")}</div><div class="note"><strong>Wichtig:</strong> Es gibt insgesamt genau 9 Gewinnerplätze. Nachrückregel greift, wenn jemand bereits qualifiziert ist.</div>`}
function renderTopspieler(){const p=document.getElementById("topspieler");const players=DATA.topspieler||[];p.innerHTML=`<div class="hero"><h2>Top-Spieler</h2><p>Underdog-Erfolge zählen nur bei echtem Duell: beide Status „Normal“.</p></div><div class="player-grid">${players.length?players.map(pl=>{const lc=splitFlagCountry(pl["Land"]||pl["Land/Flagge"]||"");return `<div class="player-card"><div class="label">Top-Spieler</div><div class="flag">${esc(lc.flag)}</div><div class="name">${esc(pl["Teilnehmer"]||"")}</div><div class="meta">${esc(lc.country)}</div></div>`}).join(""):'<div class="note">Keine Top-Spieler markiert.</div>'}</div>`}
function renderBBMC(){const p=document.getElementById("bbmc");p.innerHTML='<div class="hero"><h2>BB / MC Wertung</h2><p>Übersicht der Breitband- und Mobile-Credit-Wertungen.</p></div><div id="bbmcTable"></div>';table(document.getElementById("bbmcTable"),DATA.bbmc.headers,DATA.bbmc.rows)}
function renderVorrunde(){const p=document.getElementById("vorrunde");const rounds=[...new Set(DATA.vorrunde.rows.map(r=>r["Spieltag"]).filter(Boolean))];p.innerHTML=`<div class="toolbar"><input id="vSearch" placeholder="Suchen..."><select id="vRound"><option value="">Alle Spieltage</option>${rounds.map(r=>`<option value="${r}">Spieltag ${r}</option>`).join("")}</select></div><div id="vTable"></div>`;const headers=DATA.vorrunde.headers;function apply(){const q=document.getElementById("vSearch").value.toLowerCase(),rd=document.getElementById("vRound").value;table(document.getElementById("vTable"),headers,DATA.vorrunde.rows.filter(r=>(!rd||String(r["Spieltag"])===rd)&&JSON.stringify(r).toLowerCase().includes(q)))}document.getElementById("vSearch").addEventListener("input",apply);document.getElementById("vRound").addEventListener("change",apply);apply()}
function renderVorrundenTabelle(){searchable("vorrundentabelle",DATA.vorrunde_tabelle,DATA.vorrunde_tabelle.headers)}
function renderTop20(){const p=document.getElementById("top20");const rounds=[...new Set(DATA.top20_spielplan.rows.map(r=>r["Spieltag"]).filter(Boolean))];p.innerHTML=`<div class="two"><div class="card"><h3>Top-20 Tabelle</h3><div id="t20Rank"></div></div><div class="card"><h3>Top-20 Spielplan</h3><div class="toolbar"><input id="tSearch" placeholder="Suchen..."><select id="tRound"><option value="">Alle Spieltage</option>${rounds.map(r=>`<option value="${r}">Spieltag ${r}</option>`).join("")}</select></div><div id="t20Plan"></div></div></div>`;table(document.getElementById("t20Rank"),DATA.top20_runde.headers,DATA.top20_runde.rows);function apply(){const q=document.getElementById("tSearch").value.toLowerCase(),rd=document.getElementById("tRound").value;table(document.getElementById("t20Plan"),DATA.top20_spielplan.headers,DATA.top20_spielplan.rows.filter(r=>(!rd||String(r["Spieltag"])===rd)&&JSON.stringify(r).toLowerCase().includes(q)))}document.getElementById("tSearch").addEventListener("input",apply);document.getElementById("tRound").addEventListener("change",apply);apply()}
function renderKO(){searchable("ko",DATA.ko,DATA.ko.headers)}
document.getElementById("generated").textContent=DATA.generated;document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active")}));
renderWM();renderDabei();renderTopspieler();renderBBMC();renderVorrunde();renderVorrundenTabelle();renderTop20();renderKO();
</script>
</body>
</html>
