<style>
:root {
  --red:#e60000;
  --red2:#a80000;
  --dark:#171717;
  --bg:#f4f5f7;
  --card:#ffffff;
  --line:#e5e7eb;
  --muted:#666;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#222}
header{background:radial-gradient(circle at top right,#ff5656 0,#e60000 32%,#8d0000 100%);color:#fff;padding:34px 24px}
.wrap{max-width:1500px;margin:0 auto;padding:18px}
header .wrap{padding:0}
h1{margin:0;font-size:34px;letter-spacing:.2px}
header p{margin:8px 0 0;opacity:.95}
.tabs{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 22px}
.tab{border:0;background:white;color:#222;padding:11px 15px;border-radius:999px;cursor:pointer;font-weight:800;box-shadow:0 1px 5px rgba(0,0,0,.11)}
.tab.active{background:var(--red);color:#fff}
.panel{display:none}
.panel.active{display:block}
.hero{background:linear-gradient(135deg,#e60000,#970000);color:#fff;border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:0 7px 18px rgba(0,0,0,.14)}
.hero h2{margin:0 0 8px;font-size:28px}
.hero p{margin:0;opacity:.95;max-width:900px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
.card{background:var(--card);border-radius:18px;padding:17px;box-shadow:0 2px 10px rgba(0,0,0,.08);border:1px solid #eee;margin-bottom:16px}
.card h3{margin:0 0 12px;color:var(--red);font-size:16px}
.kpi{font-size:28px;font-weight:900}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
input,select{padding:10px 12px;border:1px solid #ccc;border-radius:10px;background:#fff;min-width:190px;font-size:14px}
button.small{padding:10px 12px;border:0;border-radius:10px;background:var(--dark);color:white;font-weight:800;cursor:pointer}
table{width:100%;border-collapse:collapse;background:white;border-radius:15px;overflow:hidden;box-shadow:0 1px 7px rgba(0,0,0,.08)}
th{background:var(--dark);color:#fff;text-align:left;position:sticky;top:0;z-index:1}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;white-space:nowrap}
td.wrapcell{white-space:normal}
tr:hover td{background:#fafafa}
.scroll{overflow:auto;max-height:72vh;border-radius:15px}
.note{background:white;border-left:5px solid var(--red);padding:13px 15px;margin:12px 0;border-radius:12px;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:800}
.status-Normal{background:#e8f5e9}.status-Frei{background:#e3f2fd}.status-Urlaub{background:#fff3e0}.status-Schule{background:#f3e5f5}.status-Krank{background:#ffebee}
.winner-grid,.player-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px;margin-top:16px}
.winner-card,.player-card{position:relative;overflow:hidden;min-height:145px;border-radius:20px;background:linear-gradient(135deg,#fff,#f8f8f8);box-shadow:0 3px 12px rgba(0,0,0,.10);padding:18px;border:1px solid #eee}
.winner-card::before,.player-card::before{content:"";position:absolute;top:0;left:0;width:100%;height:6px;background:var(--red)}
.rank{font-size:34px;font-weight:900;color:var(--red);margin-bottom:6px}
.label{position:absolute;right:12px;top:12px;background:var(--red);color:white;font-size:12px;font-weight:900;padding:5px 8px;border-radius:999px}
.name{font-size:20px;font-weight:900;margin-bottom:7px}
.meta{color:#555;font-weight:700}
.flag{font-size:28px;margin-bottom:8px;min-height:36px}
.footer-note{margin-top:20px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:950px){.two{grid-template-columns:1fr}h1{font-size:25px}th,td{font-size:12px}}
</style>
</head>

function statusBadge(v){const s=String(v||"");if(!["Normal","Frei","Urlaub","Schule","Krank"].includes(s))return esc(s);return `<span class="badge status-${s}">${s}</span>`}
function renderTable(container,headers,rows,sourceHeaders=headers){const t=document.createElement("table");t.innerHTML=`<thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody></tbody>`;const tb=t.querySelector("tbody");rows.forEach(r=>{const tr=document.createElement("tr");tr.innerHTML=sourceHeaders.map(h=>{let v=r[h]??"";if(String(h).toLowerCase().includes("status"))v=statusBadge(v);else v=display(v,h);const wc=String(h).toLowerCase().includes("hinweis")?' class="wrapcell"':"";return `<td${wc}>${v}</td>`}).join("");tb.appendChild(tr)});container.innerHTML="";const wrap=document.createElement("div");wrap.className="scroll";wrap.appendChild(t);container.appendChild(wrap)}
function renderDailyDropdown(){const holder=document.getElementById("wmDaily");const rounds=[...new Set(DATA.plan.map(r=>r["Spieltag"]))].sort((a,b)=>Number(a)-Number(b));const played=rounds.filter(round=>DATA.plan.some(r=>String(r["Spieltag"])===String(round)&&(r["Punkte S1"]!==null||r["Punkte S2"]!==null||r["Status S1"]!=="Normal"||r["Status S2"]!=="Normal")));const latest=played.length?played[played.length-1]:rounds[0];holder.innerHTML=`<div class="toolbar"><select id="dailyRound">${rounds.map(r=>`<option value="${r}" ${String(r)===String(latest)?"selected":""}>Spieltag ${r}</option>`).join("")}</select></div><div id="dailyTable"></div><div id="dailyMatches" style="margin-top:14px"></div>`;function apply(){const round=document.getElementById("dailyRound").value;const rows=DATA.plan.filter(r=>String(r["Spieltag"])===String(round));let bestName="noch offen",bestScore=null;rows.forEach(r=>[["Punkte S1","Spieler 1","Status S1"],["Punkte S2","Spieler 2","Status S2"]].forEach(x=>{const s=num(r[x[0]]);if(s!==null&&r[x[2]]==="Normal"&&(bestScore===null||s>bestScore)){bestScore=s;bestName=r[x[1]]}}));renderTable(document.getElementById("dailyTable"),["Kennzahl","Wert"],[{"Kennzahl":"Ausgewählter Spieltag","Wert":round},{"Kennzahl":"Spieler des Tages","Wert":bestName},{"Kennzahl":"Höchste Punktzahl am Tag","Wert":bestScore===null?"noch offen":bestScore}]);renderTable(document.getElementById("dailyMatches"),["Spiel Nr.","Spieler 1","Punkte S1","Spieler 2","Punkte S2","Sieger","Hinweis"],rows,["Spiel Nr.","Spieler 1","Punkte S1","Spieler 2","Punkte S2","Sieger","Hinweis inkl. Top-Scorer-Bonus"])}document.getElementById("dailyRound").addEventListener("change",apply);apply()}
function renderWM(){const p=document.getElementById("wm");const kpis=DATA.wm_kpis.filter(r=>r[0]!==""&&r[1]!=="");p.innerHTML=`<div class="hero"><h2>Top-20-Runde</h2><p>Die Vorrunde ist abgeschlossen. Für die aktuelle Tabelle zählen ausschließlich die Ergebnisse der Top-20-Runde.</p></div><div class="grid">${kpis.map(r=>`<div class="card"><h3>${esc(r[0])}</h3><div class="kpi">${display(r[1],r[0])}</div></div>`).join("")}</div><div class="note"><strong>Statusregeln:</strong> Urlaub = 1 · Frei = 1 · Schule = 1 · Krank = 0 · Gegner braucht mindestens 350 Punkte.</div><div class="two"><div class="card"><h3>Aktuelle Top 10 der Top-20-Runde</h3><div id="wmTop"></div></div><div class="card"><h3>Tagesauswertung</h3><div id="wmDaily"></div></div></div>`;renderTable(document.getElementById("wmTop"),["Rang","Teilnehmer","Flagge/Land","Spiele","Siege","Turnierpunkte","Erzielte Punkte","Ø Punkte"],DATA.top20.slice(0,10));renderDailyDropdown()}
function renderDabei(){const rows=DATA.aktuell_dabei.rows||[];document.getElementById("dabei").innerHTML=`<div class="hero"><h2>Aktuell dabei</h2><p>Aktuelle Gewinnerplätze nach der Gesamtwertung. Bereits qualifizierte Gewinner werden bei den Sonderwertungen übersprungen und der nächste berechtigte Mitarbeiter rückt nach.</p></div><div class="winner-grid">${rows.map((r,i)=>{const note=r["Nachrückregel / Hinweis"]||"";const isNach=note.toLowerCase().includes("nachrücker")||note.toLowerCase().includes("bereits qualifiziert");return `<div class="winner-card"><div class="rank">${i+1}</div><div class="label">${esc(r["Kategorie"]||"")}</div><div class="flag">${esc(r["Flagge/Land"]||"")}</div><div class="name">${esc(r["Gewinner"]||"noch offen")}</div><div class="meta">${esc(r["Wert"]||r["Rang/Quelle"]||"")}</div>${isNach?`<div class="note" style="margin-top:10px;padding:9px 10px;font-size:12px"><strong>Nachrücker:</strong> ${esc(note)}</div>`:`<div class="meta" style="font-size:12px;margin-top:10px">${esc(note)}</div>`}</div>`}).join("")}</div>`}
function renderTopspieler(){const players=DATA.top20.filter(p=>p["Top-Spieler?"]==="Ja");document.getElementById("topspieler").innerHTML=`<div class="hero"><h2>Top-Spieler</h2><p>Markierte Top-Spieler innerhalb der aktuellen Top-20-Runde.</p></div><div class="player-grid">${players.map(pl=>`<div class="player-card"><div class="label">Top-Spieler</div><div class="flag">${esc(pl["Flagge/Land"]||pl["Land"]||"")}</div><div class="name">${esc(pl["Teilnehmer"]||"")}</div></div>`).join("")}</div>`}
function renderBBMC(){const p=document.getElementById("bbmc");p.innerHTML=`<div class="hero"><h2>BB / MC Gesamtwertung</h2><p>Gesamtwerte aus Vorrunde und Top-20-Runde gemäß Excel-Datei.</p></div><div class="toolbar"><input id="bbmcSearch" placeholder="Suchen..."></div><div id="bbmcTable"></div>`;function apply(){const q=document.getElementById("bbmcSearch").value.toLowerCase();const rows=DATA.bbmc.filter(r=>JSON.stringify(r).toLowerCase().includes(q));renderTable(document.getElementById("bbmcTable"),["Teilnehmer","Flagge/Land","BB Vorrunde","BB Top20","BB Gesamt","MC Vorrunde","MC Top20","MC Gesamt"],rows)}document.getElementById("bbmcSearch").addEventListener("input",apply);apply()}
function renderTop20(){const p=document.getElementById("top20");const rounds=[...new Set(DATA.plan.map(r=>r["Spieltag"]))].sort((a,b)=>Number(a)-Number(b));p.innerHTML=`<div class="hero"><h2>Top-20-Runde</h2><p>Aktuelle Tabelle und vollständiger Spielplan mit allen 190 Begegnungen.</p></div><div class="card"><h3>Aktuelle Tabelle</h3><div id="t20Rank"></div></div><div class="card"><h3>Spielplan</h3><div class="toolbar"><input id="t20Search" placeholder="Spieler suchen..."><select id="t20Round"><option value="">Alle Spieltage</option>${rounds.map(r=>`<option value="${r}">Spieltag ${r}</option>`).join("")}</select><button class="small" id="t20Played">Nur gespielte Duelle</button></div><div id="t20Plan"></div></div>`;renderTable(document.getElementById("t20Rank"),["Rang","Teilnehmer","Flagge/Land","Top-Spieler?","Spiele","Siege","Unentsch.","Niederl.","Turnierpunkte","Erzielte Punkte","Ø Punkte","500+ Spiele","Qualifikation"],DATA.top20);let onlyPlayed=false;function apply(){const q=document.getElementById("t20Search").value.toLowerCase();const round=document.getElementById("t20Round").value;let rows=DATA.plan.filter(r=>(!round||String(r["Spieltag"])===round)&&JSON.stringify(r).toLowerCase().includes(q));if(onlyPlayed)rows=rows.filter(r=>r["Punkte S1"]!==null||r["Punkte S2"]!==null||r["Status S1"]!=="Normal"||r["Status S2"]!=="Normal");renderTable(document.getElementById("t20Plan"),["Spieltag","Datum","Wochentag","Spiel Nr.","Spieler 1","Land/Flagge 1","Status S1","Punkte S1","Spieler 2","Land/Flagge 2","Status S2","Punkte S2","Sieger","Turnierpunkte S1","Turnierpunkte S2","Hinweis"],rows,["Spieltag","Datum","Wochentag","Spiel Nr.","Spieler 1","Land/Flagge 1","Status S1","Punkte S1","Spieler 2","Land/Flagge 2","Status S2","Punkte S2","Sieger","Turnierpunkte S1","Turnierpunkte S2","Hinweis inkl. Top-Scorer-Bonus"])}document.getElementById("t20Search").addEventListener("input",apply);document.getElementById("t20Round").addEventListener("change",apply);document.getElementById("t20Played").addEventListener("click",()=>{onlyPlayed=!onlyPlayed;document.getElementById("t20Played").textContent=onlyPlayed?"Alle Duelle anzeigen":"Nur gespielte Duelle";apply()});apply()}
function renderKO(){document.getElementById("ko").innerHTML=`<div class="hero"><h2>K.O.-Phase</h2><p>Die K.O.-Phase wird nach Abschluss der Top-20-Runde befüllt.</p></div><div class="note">Platz 1–6 qualifizieren sich direkt für das Viertelfinale. Platz 7–10 spielen die Play-In-Runde.</div>`}
document.addEventListener("DOMContentLoaded",()=>{document.getElementById("generated").textContent=DATA.generated;document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));btn.classList.add("active");document.getElementById(btn.dataset.tab).classList.add("active")}));renderWM();renderDabei();renderTopspieler();renderBBMC();renderTop20();renderKO()});
</script>
</body>
</html>
